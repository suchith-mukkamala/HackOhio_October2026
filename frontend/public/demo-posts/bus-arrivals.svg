<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A delay you can actually notice."><rect width="960" height="540" fill="#0e1726"/><g font-family="Arial,sans-serif"><text x="40" y="42" font-size="12" fill="#78acff">KEYSTONE / BUILDER NOTES</text><text x="40" y="91" font-size="30" fill="#edf4ff">A delay you can actually notice.</text><text x="40" y="123" font-size="15" fill="#9fb1ca">Arrival interface study / replace a color-only cue with a clear label.</text><rect x="40" y="151" width="410" height="326" rx="16" fill="#18283d" stroke="#30445f"/><rect x="474" y="151" width="446" height="326" rx="16" fill="#18283d" stroke="#30445f"/><text x="65" y="187" font-size="12" fill="#78acff">BEFORE / COLOR ALONE</text><rect x="65" y="214" width="360" height="194" rx="16" fill="#101b2b" stroke="#30445f"/><text x="85" y="247" font-size="21" fill="#eff5ff">Campus arrivals</text><text x="85" y="285" font-size="17" fill="#d7e3f5">Campus Loop North</text><text x="85" y="316" font-size="14" fill="#9fb1ca">Thompson Library</text><text x="85" y="368" font-size="13" fill="#9fb1ca">Next bus</text><text x="330" y="370" font-size="24" fill="#f8c86b">8 min</text><text x="499" y="187" font-size="12" fill="#78acff">AFTER / CLEAR STATUS</text><rect x="499" y="214" width="360" height="194" rx="16" fill="#101b2b" stroke="#30445f"/><text x="519" y="247" font-size="21" fill="#eff5ff">Campus arrivals</text><text x="519" y="285" font-size="17" fill="#d7e3f5">Campus Loop North</text><text x="519" y="316" font-size="14" fill="#9fb1ca">Thompson Library</text><text x="519" y="368" font-size="13" fill="#9fb1ca">Next bus</text><text x="764" y="370" font-size="24" fill="#f8c86b">8 min</text><circle cx="396" cy="281" r="6" fill="#f8c86b"/><rect x="714" y="266" width="123" height="32" rx="16" fill="#443521" stroke="#30445f"/><text x="729" y="288" font-size="12" fill="#ffda8c">DELAYED</text><text x="65" y="445" font-size="14" fill="#9fb1ca">A color change is easy to miss.</text><text x="499" y="445" font-size="14" fill="#9fb1ca">State the delay in plain language.</text><text x="40" y="511" font-size="11" fill="#7487a2">ILLUSTRATIVE SAMPLE / PROJECT PROTOTYPE</text></g></svg>