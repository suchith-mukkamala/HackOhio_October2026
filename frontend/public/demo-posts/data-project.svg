<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Start with the question."><rect width="960" height="540" fill="#0e1726"/><g font-family="Arial,sans-serif"><text x="40" y="42" font-size="12" fill="#78acff">KEYSTONE / BUILDER NOTES</text><text x="40" y="91" font-size="30" fill="#edf4ff">Start with the question.</text><text x="40" y="123" font-size="15" fill="#9fb1ca">A practical reading-list framework for your next data project.</text><rect x="40" y="167" width="280" height="272" rx="16" fill="#18283d" stroke="#30445f"/><text x="63" y="210" font-size="24" fill="#78acff">01</text><text x="63" y="254" font-size="25" fill="#edf4ff">Question</text><text x="63" y="300" font-size="13" fill="#9fb1ca">What decision will this help?</text><text x="63" y="330" font-size="13" fill="#9fb1ca">Define a useful outcome.</text><path d="M325 300h10m-5-5 5 5-5 5" stroke="#78acff" stroke-width="2" fill="none"/><rect x="340" y="167" width="280" height="272" rx="16" fill="#18283d" stroke="#30445f"/><text x="363" y="210" font-size="24" fill="#78acff">02</text><text x="363" y="254" font-size="25" fill="#edf4ff">Dataset</text><text x="363" y="300" font-size="13" fill="#9fb1ca">Check source and missingness.</text><text x="363" y="330" font-size="13" fill="#9fb1ca">Start with a simple plot.</text><path d="M625 300h10m-5-5 5 5-5 5" stroke="#78acff" stroke-width="2" fill="none"/><rect x="640" y="167" width="280" height="272" rx="16" fill="#18283d" stroke="#30445f"/><text x="663" y="210" font-size="24" fill="#78acff">03</text><text x="663" y="254" font-size="25" fill="#edf4ff">Model</text><text x="663" y="300" font-size="13" fill="#9fb1ca">Establish a baseline first.</text><text x="663" y="330" font-size="13" fill="#9fb1ca">Test against your question.</text><text x="40" y="475" font-size="16" fill="#c1cfe2">Understand the problem before reaching for a model.</text><text x="40" y="511" font-size="11" fill="#7487a2">ILLUSTRATIVE SAMPLE / PROJECT PROTOTYPE</text></g></svg>